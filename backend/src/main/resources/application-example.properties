spring.application.name=college-lost-and-found-backend

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/lost_and_found
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# ===============================
# JWT Authentication
# ===============================
# Secret used to sign JWTs. MUST be at least 32 characters long (HS256).
# Generate one with: openssl rand -hex 32
app.jwt.secret=YOUR_JWT_SECRET_AT_LEAST_32_CHARS_LONG
# Token lifetime in milliseconds (86400000 = 24 hours)
app.jwt.expiration-ms=86400000

# ===============================
# Admin Bootstrap Account
# ===============================
# On startup the backend creates an ADMIN account with these credentials
# (only if no account with this email exists). Keep these in your local
# application.properties - never commit them.
app.admin.email=admin@college.edu
app.admin.password=YOUR_ADMIN_PASSWORD

# ===============================
# Cloudinary Configuration
# ===============================
# Server-side Cloudinary credentials for item image uploads.
# Keep these in your local environment or application.properties - never commit real keys.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:YOUR_CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY:YOUR_CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:YOUR_CLOUDINARY_API_SECRET}

# Multipart File Upload Limits (Max 5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Email Service Configuration
# (Enter your SMTP credentials below to activate live email alerts)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email-id
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.frontend.url=http://localhost:5173
