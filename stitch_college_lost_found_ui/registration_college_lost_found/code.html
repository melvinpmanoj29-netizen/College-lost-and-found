<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md antialiased">
<!-- Main Registration Card -->
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl p-lg shadow-sm">
<!-- Header -->
<header class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg md:font-headline-lg md:text-headline-lg text-primary mb-sm">CampusFound</h1>
<p class="font-body-md text-body-md text-secondary">Register to start reporting lost and found items on campus.</p>
</header>
<!-- Form -->
<form class="space-y-md" id="registerForm">
<!-- Student Name -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="studentName">Student Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-xl pr-sm py-sm border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors font-body-md text-body-md" id="studentName" name="studentName" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<!-- Roll Number -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="rollNumber">Roll Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="badge">badge</span>
<input class="w-full pl-xl pr-sm py-sm border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors font-body-md text-body-md" id="rollNumber" name="rollNumber" placeholder="CS2024-001" required="" type="text"/>
</div>
</div>
<!-- Class / Department -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="classDept">Class / Department</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="school">school</span>
<select class="w-full pl-xl pr-sm py-sm border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors font-body-md text-body-md appearance-none" id="classDept" name="classDept" required="">
<option class="text-outline" disabled="" selected="" value="">Select your department</option>
<option value="cs">Computer Science</option>
<option value="eng">Engineering</option>
<option value="arts">Arts &amp; Humanities</option>
<option value="business">Business School</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Email -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">University Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-xl pr-sm py-sm border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors font-body-md text-body-md" id="email" name="email" placeholder="jane.doe@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-xl pr-xl py-sm border border-outline-variant rounded-DEFAULT bg-surface-container-lowest text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-secondary mt-1">Must be at least 8 characters long.</p>
</div>
<!-- Submit Action -->
<div class="pt-sm">
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-sm px-lg rounded-DEFAULT hover:shadow-[0_4px_6px_-1px_rgb(0,0,0,0.1),0_2px_4px_-2px_rgb(0,0,0,0.1)] transition-all duration-200 flex items-center justify-center space-x-sm" type="submit">
<span>Register</span>
<span class="material-symbols-outlined text-sm" data-icon="how_to_reg">how_to_reg</span>
</button>
</div>
<!-- Success Indicator (Hidden by default) -->
<div class="hidden mt-md bg-surface-container p-sm rounded-DEFAULT border-l-4 border-primary flex items-start space-x-sm" id="successMessage">
<span class="material-symbols-outlined text-primary" data-icon="check_circle">check_circle</span>
<div>
<h4 class="font-label-md text-label-md text-on-surface">Registration Successful</h4>
<p class="font-body-sm text-body-sm text-secondary">Redirecting to login...</p>
</div>
</div>
</form>
<!-- Footer Links -->
<div class="mt-lg pt-md border-t border-outline-variant text-center">
<p class="font-body-sm text-body-sm text-secondary">
                Already have an account? 
                <a class="text-primary hover:underline font-label-md text-label-md" href="#">Log in</a>
</p>
</div>
</main>
<script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const successMsg = document.getElementById('successMessage');
            
            // Basic simulation of loading state
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span><span class="ml-2">Registering...</span>`;
            btn.disabled = true;
            btn.classList.add('opacity-75');

            // Simulate API call
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-75');
                
                // Show success
                successMsg.classList.remove('hidden');
                
                // Optional: clear form
                // this.reset();
            }, 1500);
        });
    </script>
</body></html>
