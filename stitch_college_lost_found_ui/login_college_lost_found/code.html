<body class="h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-surface-bright text-on-surface">
<div class="sm:mx-auto sm:w-full sm:max-w-md mb-lg">
<h2 class="mt-6 text-center font-display-lg text-display-lg text-primary tracking-tight">
            CampusFound
        </h2>
<p class="mt-2 text-center font-body-md text-body-md text-secondary">
            Sign in to your university account
        </p>
</div>
<div class="sm:mx-auto sm:w-full sm:max-w-md">
<div class="bg-surface-container-lowest py-8 px-4 shadow-[0_1px_3px_0_rgb(0,0,0,0.1),0_1px_2px_-1px_rgb(0,0,0,0.1)] sm:rounded-xl border border-outline-variant sm:px-10">
<form action="#" class="space-y-6" id="loginForm" method="POST">
<div>
<label class="block font-label-md text-label-md text-on-surface" for="email">Email address</label>
<div class="mt-sm">
<input autocomplete="email" class="block w-full appearance-none rounded-lg border border-outline-variant px-3 py-2 placeholder-outline text-on-surface focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 sm:font-body-md sm:text-body-md" id="email" name="email" placeholder="student@university.edu" required="" type="email"/>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="mt-sm">
<input autocomplete="current-password" class="block w-full appearance-none rounded-lg border border-outline-variant px-3 py-2 placeholder-outline text-on-surface focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 sm:font-body-md sm:text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-secondary" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="font-label-sm text-label-sm">
<a class="text-primary hover:text-primary-fixed-variant transition-colors" href="#">
                            Forgot your password?
                        </a>
</div>
</div>
<div>
<button class="flex w-full justify-center rounded-lg bg-primary-container px-3 py-2 font-label-md text-label-md text-on-primary shadow-sm hover:shadow-md hover:bg-primary transition-all focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary relative overflow-hidden" id="submitBtn" type="submit">
<span id="btnText">Sign in</span>
<span class="hidden absolute inset-0 flex items-center justify-center bg-primary-container" id="loadingSpinner">
<span class="material-symbols-outlined animate-spin" style="font-variation-settings: 'FILL' 1;">progress_activity</span>
</span>
</button>
</div>
</form>
<div class="mt-6">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center font-label-sm text-label-sm">
<span class="bg-surface-container-lowest px-2 text-secondary">New to CampusFound?</span>
</div>
</div>
<div class="mt-6">
<a class="flex w-full justify-center rounded-lg bg-surface-container-lowest px-3 py-2 font-label-md text-label-md text-on-surface border border-outline-variant shadow-sm hover:bg-surface-container-low transition-colors" href="#">
                        Create an account
                    </a>
</div>
</div>
</div>
<!-- Example Error Alert (Hidden by default for demo) -->
<div class="hidden mt-lg bg-error-container border-l-4 border-error p-4 rounded-r-lg shadow-sm" id="errorAlert">
<div class="flex">
<div class="flex-shrink-0">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<div class="ml-3">
<p class="font-body-sm text-body-sm text-on-error-container">
                        Invalid email or password. Please try again.
                    </p>
</div>
</div>
</div>
</div>
<script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('loadingSpinner');
            const submitBtn = document.getElementById('submitBtn');
            const emailInput = document.getElementById('email');
            
            // Simple validation demo
            if(!emailInput.value.includes('@')) {
                emailInput.classList.add('border-error', 'focus:ring-error/20');
                document.getElementById('errorAlert').classList.remove('hidden');
                return;
            } else {
                 emailInput.classList.remove('border-error', 'focus:ring-error/20');
                 document.getElementById('errorAlert').classList.add('hidden');
            }

            // Loading state demo
            btnText.classList.add('invisible');
            spinner.classList.remove('hidden');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

            setTimeout(() => {
                // Reset state after "login"
                btnText.classList.remove('invisible');
                spinner.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                
                // Show error for demo purposes
                document.getElementById('errorAlert').classList.remove('hidden');
            }, 1500);
        });
    </script>
